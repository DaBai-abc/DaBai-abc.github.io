<!DOCTYPE html>
<!-- ============================================================
     文章模板 · 由 publish.py 自动填充，一般不需要手改。

     手写新文章（不用 Markdown）时也可以复制本文件到 /blog/ 下，
     把下面 {{...}} 占位符全部替换成实际内容。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} · 大白</title>
<meta name="description" content="{{SUMMARY}}" />
<link rel="stylesheet" href="/assets/blog.css" />
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a class="brand" href="/">大白<span>.</span></a>
    <div class="menu">
      <a href="/">首页</a>
      <a href="/blog/">博客</a>
      <a href="/blog/resources.html">资源</a>
      <a href="https://github.com/DaBai-abc" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <article>
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <span>{{DATE}}</span>
      {{TAGS}}
    </div>

{{CONTENT}}

    <hr />
    <p><a class="btn ghost" href="/blog/">← 返回文章列表</a></p>
  </article>

  <footer>© <span id="year"></span> 大白 · Built with GitHub Pages</footer>
</div>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
