<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>博客 · 大白</title>
<meta name="description" content="大白的博客：教程、笔记与资源。" />
<link rel="stylesheet" href="/assets/blog.css" />
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a class="brand" href="/">大白<span>.</span></a>
    <div class="menu">
      <a href="/">首页</a>
      <a href="/blog/">博客</a>
      <a href="/blog/resources.html">资源</a>
      <a href="https://github.com/DaBai-abc" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <div class="page-head">
    <h1>博客 / 教程</h1>
    <p>把踩过的坑、跑通的流程写下来。偶尔也整理一些可复用的资源。</p>
  </div>

  <!-- 文章列表由 /data/posts.json 渲染，发文无需手改本文件 -->
  <div class="post-list" id="post-list">
    <noscript><p>本列表需要 JavaScript 才能显示。</p></noscript>
  </div>

  <footer>© <span id="year"></span> 大白 · Built with GitHub Pages</footer>
</div>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

fetch('/data/posts.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (posts) {
    var box = document.getElementById('post-list');
    if (!Array.isArray(posts) || !posts.length) {
      box.innerHTML = '<p style="color:var(--text-soft)">还没有文章。</p>';
      return;
    }
    box.innerHTML = posts.map(function (p) {
      var tags = (p.tags || [p.tag]).filter(Boolean)
        .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      return '<a class="post-item" href="/blog/' + esc(p.slug) + '.html">'
        + '<span class="date">' + esc(p.date) + '</span>'
        + '<h2>' + esc(p.title) + '</h2>'
        + '<p>' + esc(p.summary || '') + '</p>'
        + '<div>' + tags + '</div>'
        + '</a>';
    }).join('');
  })
  .catch(function () {
    document.getElementById('post-list').innerHTML =
      '<p style="color:var(--text-soft)">文章列表加载失败，<a href="/data/posts.json">点此查看数据</a>。</p>';
  });
</script>
</body>
</html>
