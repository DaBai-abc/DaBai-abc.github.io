<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>工具箱 · 需要口令</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#ffffff; --text:#1d1d1b; --soft:#6d6b64; --line:#e3e0d8;
    --accent:#2f6f5e; --accent-ink:#ffffff; --danger:#b2413a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141417; --card:#1d1d22; --text:#ececea; --soft:#9d9ca5; --line:#2d2d34;
      --accent:#63c1a2; --accent-ink:#0d2a22; --danger:#e08079;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:392px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:34px 30px 26px;
  }
  .badge{
    width:42px; height:42px; border-radius:12px; margin-bottom:20px;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .badge svg{display:block}
  h1{font-size:19px; font-weight:500; margin:0 0 8px; letter-spacing:.01em}
  .hint{font-size:13.5px; line-height:1.65; color:var(--soft); margin:0 0 22px}
  label{display:block; font-size:12px; color:var(--soft); margin-bottom:7px; letter-spacing:.04em}
  input{
    width:100%; padding:12px 14px; font-size:15px; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; outline:none; font-family:inherit;
    transition:border-color .15s ease;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; margin-top:14px; padding:12px 16px; font-size:14.5px; font-weight:500;
    color:var(--accent-ink); background:var(--accent); border:none; border-radius:10px;
    cursor:pointer; font-family:inherit; transition:opacity .15s ease;
  }
  button:hover{opacity:.9}
  button:disabled{opacity:.55; cursor:default}
  .msg{min-height:20px; margin-top:12px; font-size:13px; color:var(--danger)}
  .foot{margin-top:18px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; line-height:1.6; color:var(--soft)}
  noscript{display:block; font-size:13px; color:var(--danger)}
</style>
</head>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('vault-data').textContent);
  var CACHE_KEY = 'dabai.vault.' + DATA.id;
  var TTL = 30 * 60 * 1000;

  var msg = document.getElementById('msg');
  var input = document.getElementById('pw');
  var btn = document.getElementById('go');

  function b64ToBuf(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function injectLock(html) {
    var s = '<scr' + 'ipt>(function(){'
      + 'var b=document.createElement("button");'
      + 'b.textContent="锁定";'
      + 'b.title="清除本页缓存并重新上锁";'
      + 'b.style.cssText="position:fixed;right:14px;bottom:14px;z-index:2147483000;'
      + 'font:12px/1 -apple-system,BlinkMacSystemFont,PingFang SC,sans-serif;padding:8px 14px;'
      + 'border-radius:999px;border:1px solid rgba(130,130,130,.4);background:rgba(130,130,130,.14);'
      + 'color:inherit;cursor:pointer;opacity:.5;transition:opacity .15s";'
      + 'b.onmouseenter=function(){b.style.opacity=1};'
      + 'b.onmouseleave=function(){b.style.opacity=.5};'
      + 'b.onclick=function(){try{sessionStorage.removeItem("' + CACHE_KEY + '")}catch(e){};location.reload()};'
      + 'document.body.appendChild(b);'
      + '})();</scr' + 'ipt>';
    return html.replace(/<\/body>/i, s + '</body>');
  }

  function paint(html) {
    if (DATA.lock) html = injectLock(html);
    document.open();
    document.write(html);
    document.close();
  }

  function readCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || !d.html || Date.now() > d.exp) { sessionStorage.removeItem(CACHE_KEY); return null; }
      return d.html;
    } catch (e) { return null; }
  }

  function writeCache(html) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ html: html, exp: Date.now() + TTL })); } catch (e) {}
  }

  function fail(text) {
    msg.textContent = text;
    btn.disabled = false;
    btn.textContent = '解锁';
    input.focus();
    input.select();
  }

  function unlock(pw) {
    var te = new TextEncoder();
    return crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBuf(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBuf(DATA.iv), tagLength: 128 },
          key, b64ToBuf(DATA.ct));
      })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function submit() {
    var pw = input.value;
    if (!pw) { fail('请输入口令'); return; }
    if (!window.crypto || !crypto.subtle) { fail('当前环境不支持解密，请用 https 打开本页'); return; }
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '解密中…';
    unlock(pw).then(function (obj) {
      writeCache(obj.html);
      paint(obj.html);
    }).catch(function () {
      fail('口令不对');
    });
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  var cached = readCache();
  if (cached) paint(cached);
})();
</script>
