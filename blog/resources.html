<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>资源 · 大白</title>
<meta name="description" content="大白整理的资源入口，内容托管于第三方付费平台。" />
<link rel="stylesheet" href="/assets/blog.css" />
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a class="brand" href="/">大白<span>.</span></a>
    <div class="menu">
      <a href="/">首页</a>
      <a href="/blog/">博客</a>
      <a href="/blog/resources.html">资源</a>
      <a href="https://github.com/DaBai-abc" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <div class="page-head">
    <h1>资源</h1>
    <p>整理好的模板、脚本与清单。内容托管在第三方付费平台，这里只放入口。</p>
  </div>

  <!-- 资源列表由 /data/resources.json 渲染：加一条资源 = 加一条记录 -->
  <div id="res-list">
    <noscript><p>本列表需要 JavaScript 才能显示。</p></noscript>
  </div>

  <div class="callout">
    <span class="label">说明</span>
    <p>本页只放第三方平台的入口链接，不存放任何资源直链。</p>
  </div>

  <footer>© <span id="year"></span> 大白 · Built with GitHub Pages</footer>
</div>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

fetch('/data/resources.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (items) {
    var box = document.getElementById('res-list');
    if (!Array.isArray(items) || !items.length) {
      box.innerHTML = '<p style="color:var(--text-soft)">暂时还没有上架的资源。</p>';
      return;
    }
    box.innerHTML = items.map(function (it) {
      var tag = it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '';
      var desc = it.desc ? '<p>' + esc(it.desc) + '</p>' : '';
      return '<div class="res-card">'
        + '<h2>' + esc(it.title) + '</h2>'
        + (tag ? '<div style="margin:0 0 10px">' + tag + '</div>' : '')
        + desc
        + '<a class="btn primary" href="' + esc(it.url) + '" target="_blank" rel="noopener">查看详情 →</a>'
        + '</div>';
    }).join('');
  })
  .catch(function () {
    document.getElementById('res-list').innerHTML =
      '<p style="color:var(--text-soft)">资源列表加载失败，<a href="/data/resources.json">点此查看数据</a>。</p>';
  });
</script>
</body>
</html>
